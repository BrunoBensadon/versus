# Nightly backup of versus (spec §10, durability layer 2). Lives in the PRIVATE repo
# BrunoBensadon/versus-backup at .github/workflows/backup.yml, next to split-export.mjs.
# Source of truth: versus/ops/versus-backup/ (copy both files over when they change).
# GitHub auto-disables scheduled workflows only in PUBLIC repos after 60 days without activity
# (⚠️ as documented, not tested); this repo is private, so nights with no new data (and so no
# commit) don't switch it off.
name: Nightly backup

on:
  schedule:
    - cron: '17 3 * * *' # 03:17 UTC every day
  workflow_dispatch: # "Run workflow" button for a manual backup
    inputs:
      allow_fewer:
        description: 'Accept FEWER events than the last backup (only after restoring an older backup on purpose)'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5

      - name: Download the export
        env:
          VERSUS_URL: ${{ secrets.VERSUS_URL }}
          BACKUP_TOKEN: ${{ secrets.BACKUP_TOKEN }}
        run: |
          curl --fail --silent --show-error \
            -H "Authorization: Bearer $BACKUP_TOKEN" \
            "$VERSUS_URL/api/export" -o export.json

      # split-export.mjs fails this run (and GitHub emails you) if the export is malformed or has
      # fewer events than the last backup; the files from the last good night stay as they are.
      # Note: the app's Settings still shows the backup as fresh, because the export WAS served.
      - name: Split into diff-friendly files
        env:
          ALLOW_FEWER: ${{ inputs.allow_fewer }} # empty on the nightly schedule
        run: |
          if [ "$ALLOW_FEWER" = "true" ]; then
            node split-export.mjs export.json --allow-fewer
          else
            node split-export.mjs export.json
          fi
          rm export.json

      - name: Commit if anything changed
        run: |
          git config user.name "versus-backup"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add meta.json events.jsonl library.json sublists.json games.json external_ids.json
          git diff --cached --quiet -- events.jsonl library.json sublists.json games.json external_ids.json \
            && echo "No data changes since the last backup." \
            || { git commit -m "backup $(date -u +%F)" && git push; }
